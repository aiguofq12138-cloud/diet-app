<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饮食助手</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="饮食助手">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FFF5F7">
<link rel="manifest" href="/diet-app/manifest.json">
<link rel="apple-touch-icon" href="/diet-app/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/diet-app/icon-192.png">
    <style>
        :root {
            --primary: #FF6B9E;
            --secondary: #8B5CF6;
            --accent: #FFD166;
            --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #F0F4FF 100%);
            --card-bg: #ffffff;
            --text-main: #2D3748;
            --text-sub: #718096;
            --border: #FBB6CE;
            --tab-height: 65px;
            --input-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 12px 15px; padding-top: calc(12px + env(safe-area-inset-top)); text-align: center; font-weight: 800; font-size: 18px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 107, 158, 0.15); background-clip: text; -webkit-background-clip: text; color: transparent; background-image: linear-gradient(135deg, var(--primary), var(--secondary)); }

        .content { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        .panel { display: none; height: 100%; overflow-y: auto; padding: 15px; padding-bottom: calc(var(--input-height) + var(--tab-height) + 20px); }
        .panel.active { display: block; }

        .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 22px; margin-bottom: 20px; font-size: 15px; line-height: 1.6; position: relative; word-wrap: break-word; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(15px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .chat-user { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; margin-left: auto; border-bottom-right-radius: 6px; box-shadow: 0 8px 20px rgba(255, 107, 158, 0.3); padding-right: 48px; }
        .chat-ai { background: var(--card-bg); color: var(--text-main); margin-right: auto; border-bottom-left-radius: 6px; box-shadow: 0 8px 20px rgba(139, 92, 246, 0.15); border: 2px solid rgba(255, 107, 158, 0.2); padding-left: 48px; }
        .chat-ai::before { content: "🥗"; position: absolute; left: 8px; top: 10px; width: 30px; height: 30px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(255, 209, 102, 0.5); font-size: 14px; }
        .chat-user::after { content: "😊"; position: absolute; right: 8px; top: 10px; width: 30px; height: 30px; background: #A78BFA; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(167, 139, 250, 0.5); font-size: 14px; }

        .input-area { position: fixed; bottom: var(--tab-height); left: 0; width: 100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255, 107, 158, 0.15); display: flex; gap: 10px; z-index: 50; }
        .input-area input { flex: 1; padding: 14px 20px; border: 2px solid #FDE68A; border-radius: 30px; outline: none; font-size: 16px; background: #FFFBEB; transition: 0.3s; }
        .input-area input:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 107, 158, 0.2); }
        .input-area button { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; width: 52px; height: 52px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 15px rgba(255, 107, 158, 0.4); }
        .input-area button:active { transform: scale(0.9); }
        .input-area button:disabled { background: #cbd5e1; box-shadow: none; }

        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(var(--tab-height) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 107, 158, 0.15); z-index: 100; }
        .tab { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 10px; color: var(--text-sub); cursor: pointer; transition: 0.3s; gap: 4px; }
        .tab .icon { font-size: 22px; transition: 0.3s; filter: grayscale(1) opacity(0.4); }
        .tab.active { color: var(--primary); font-weight: 800; }
        .tab.active .icon { filter: grayscale(0) opacity(1); transform: translateY(-4px) scale(1.1); drop-shadow: 0 4px 8px rgba(255,107,158,0.4); }

        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px -5px rgba(255, 107, 158, 0.15); border: 2px solid rgba(255, 107, 158, 0.1); }
        .card-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .card-header h3 { font-size: 16px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 6px; }

        .date-action-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        input[type="date"], input[type="number"] {
            flex: 1 1 120px;
            min-width: 120px;
            padding: 10px 8px;
            border-radius: 12px;
            border: 2px solid #FDE68A;
            font-size: 13px;
            outline: none;
            background: #FFFBEB;
            color: var(--text-main);
            font-weight: 700;
            font-family: inherit;
        }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transform: scale(1.1); }

        .action-btn-sm { padding: 10px 14px; font-size: 13px; background: linear-gradient(135deg, var(--secondary), #A78BFA); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); white-space: nowrap; flex-shrink: 0; }
        .download-btn { padding: 10px 14px; font-size: 13px; background: linear-gradient(135deg, #FFD166, #F59E0B); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; box-shadow: 0 4px 10px rgba(255, 209, 102, 0.4); white-space: nowrap; }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #FDE68A; word-break: break-word; }
        th { color: var(--secondary); font-weight: 700; font-size: 12px; }
        .tag { display: inline-block; padding: 4px 8px; border-radius: 10px; font-size: 11px; background: #FFFBEB; color: #D97706; font-weight: 700; border: 1px solid #FDE68A; white-space: nowrap; }

        .weight-list { margin-top: 15px; border-top: 1px dashed #FDE68A; padding-top: 10px; }
        .trend-down { background: #D1FAE5; color: #059669; }
        .trend-up { background: #FEE2E2; color: #DC2626; }
        .trend-same { background: #E5E7EB; color: #4B5563; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; font-weight: 700; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #E9D5FF; border-radius: 14px; outline: none; font-size: 16px; background: #FAF5FF; appearance: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 107, 158, 0.15); }

        .action-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(255, 107, 158, 0.3); margin-top: 10px; }
        .action-btn:active { transform: scale(0.96); }

        .analysis-content { background: var(--card-bg); border-radius: 20px; padding: 20px; display: none; box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15); border: 2px solid rgba(139, 92, 246, 0.1); animation: popIn 0.4s; font-size: 14px; line-height: 1.8; color: var(--text-main); }
        .analysis-content h4 { color: var(--secondary); margin: 15px 0 8px 0; font-size: 15px; }
        .analysis-content h4.bad { color: #EF4444; }
        .analysis-content ul { padding-left: 20px; }
        .analysis-content li { margin-bottom: 4px; }
        .analysis-content br { line-height: 1.8; }

        .weight-item {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 10px 0 !important;
            gap: 12px !important;
            border-bottom: 1px solid #FAF5FF;
        }
        .weight-item .date {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            white-space: nowrap !important;
            font-size: 13px !important;
            color: var(--text-sub);
            font-weight: 500;
        }
        .weight-item > span:last-child {
            flex: 0 0 auto !important;
            white-space: nowrap !important;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .weight-item .value {
            font-weight: 800;
            color: var(--secondary);
            font-size: 16px;
            white-space: nowrap;
        }
        .weight-item .trend {
            font-size: 12px;
            margin-left: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>🥗 饮食助手</header>

    <div class="content">
        <div id="panel-chat" class="panel active"></div>

        <div id="panel-table" class="panel">
            <div class="card">
                <div class="card-header">
                    <h3>📅 饮食记录</h3>
                    <div class="date-action-row">
                        <input type="date" id="date-filter" onchange="renderTable()">
                        <button class="download-btn" onclick="downloadCSV()">⬇️ 导出CSV</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>餐次</th><th>食物</th><th>数量</th><th>热量</th></tr></thead>
                        <tbody id="diet-table-body"><tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">该日暂无记录</td></tr></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>⚖️ 体重记录</h3>
                    <div class="date-action-row">
                        <input type="date" id="weight-date">
                        <input type="number" id="weight-input" placeholder="体重 (kg)" step="0.1">
                        <button class="action-btn-sm" onclick="saveWeight()">记录</button>
                    </div>
                </div>
                <div class="weight-list" id="weight-list">
                    <div style="text-align:center; color:#999; font-size:13px; padding:10px;">暂无体重数据</div>
                </div>
            </div>
        </div>

        <div id="panel-analysis" class="panel">
            <button class="action-btn" onclick="generateAnalysis()" style="margin-bottom: 15px;">✨ 生成饮食优缺点分析</button>
            <div id="analysis-content" class="analysis-content"></div>
        </div>

        <div id="panel-profile" class="panel">
            <div class="card">
                <h3>👤 个人基础信息</h3>
                <div class="form-group"><label>性别</label><select id="profile-gender"><option value="男">男</option><option value="女">女</option></select></div>
                <div class="form-group"><label>年龄</label><input type="number" id="profile-age" placeholder="例如：28"></div>
                <div class="form-group"><label>身高 (cm)</label><input type="number" id="profile-height" placeholder="例如：175"></div>
                <div class="form-group"><label>体重 (kg)</label><input type="number" id="profile-weight" placeholder="例如：70"></div>
                <div class="form-group"><label>饮食目标</label><select id="profile-goal"><option value="保持健康">保持健康</option><option value="减脂">减脂</option><option value="增肌">增肌</option><option value="控糖">控糖</option></select></div>
                <button class="action-btn" onclick="saveProfile()">保存信息</button>
            </div>
        </div>
    </div>

    <div class="input-area" id="inputArea">
        <input type="text" id="userInput" placeholder="描述你吃了什么，或者体重..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="sendBtn">➤</button>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('chat', this)"><span class="icon">💬</span>对话</div>
        <div class="tab" onclick="switchTab('table', this)"><span class="icon">📋</span>表格</div>
        <div class="tab" onclick="switchTab('analysis', this)"><span class="icon">📈</span>分析</div>
        <div class="tab" onclick="switchTab('profile', this)"><span class="icon">👤</span>我的</div>
    </div>

    <script>
        const API_KEY = '';
        const API_URL = 'https://diet-api.aiguofq12138.workers.dev';
        const MODEL_NAME = 'deepseek-v4.1-flash';

        let chatHistory = [], dietRecords = [], weightRecords = [], userProfile = {};

        const recordDietTool = {
            type: "function", function: { name: "record_diet", description: "记录用户的饮食数据", parameters: { type: "object", properties: { meal: { type: "string", description: "餐次" }, foods: { type: "array", items: { type: "object", properties: { name: { type: "string" }, quantity: { type: "string" }, calories: { type: "string" } }, required: ["name", "quantity", "calories"] } } }, required: ["meal", "foods"] } }
        };
        const recordWeightTool = {
            type: "function", function: { name: "record_weight", description: "记录用户的体重数据", parameters: { type: "object", properties: { weight: { type: "string", description: "体重数值，单位kg，如'65.5'" }, date: { type: "string", description: "日期，格式YYYY-MM-DD，如果不填默认今天" } }, required: ["weight"] } }
        };

        function getLocalDateStr(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        window.onload = function() {
            const today = getLocalDateStr();
            document.getElementById('date-filter').value = today;
            document.getElementById('weight-date').value = today;

            const savedChat = localStorage.getItem('diet_app_chat');
            chatHistory = savedChat ? JSON.parse(savedChat) : [{ role: "system", content: "你是一个专业、热情的饮食记录营养师。如果用户描述了饮食，调用 record_diet 工具记录数据；如果用户提到了体重（如'我今早体重65公斤'），调用 record_weight 工具记录；如果用户提问，请提供专业、易懂的营养学建议。并在记录完成后给出一句简短的健康点评。" }];
            const chatPanel = document.getElementById('panel-chat'); chatPanel.innerHTML = '';
            chatHistory.forEach(msg => { if (msg.role === 'user') addBubble('user', msg.content); else if (msg.role === 'assistant') addBubble('ai', msg.content); });

            const savedRecords = localStorage.getItem('diet_app_records'); if (savedRecords) { dietRecords = JSON.parse(savedRecords); renderTable(); }
            const savedWeights = localStorage.getItem('diet_app_weights'); if (savedWeights) { weightRecords = JSON.parse(savedWeights); renderWeightList(); }

            const savedProfile = localStorage.getItem('diet_app_profile');
            if (savedProfile) { userProfile = JSON.parse(savedProfile); document.getElementById('profile-gender').value = userProfile.gender || '男'; document.getElementById('profile-age').value = userProfile.age || ''; document.getElementById('profile-height').value = userProfile.height || ''; document.getElementById('profile-weight').value = userProfile.weight || ''; document.getElementById('profile-goal').value = userProfile.goal || '保持健康'; }
        };

        function saveProfile() {
            userProfile = { gender: document.getElementById('profile-gender').value, age: document.getElementById('profile-age').value, height: document.getElementById('profile-height').value, weight: document.getElementById('profile-weight').value, goal: document.getElementById('profile-goal').value };
            localStorage.setItem('diet_app_profile', JSON.stringify(userProfile));
            alert("个人信息已保存！");
        }

        function saveWeight() {
            const date = document.getElementById('weight-date').value;
            const weight = document.getElementById('weight-input').value;
            if (!date || !weight) { alert("请选择日期并输入体重！"); return; }

            const existingIndex = weightRecords.findIndex(r => r.date === date);
            if (existingIndex > -1) {
                weightRecords[existingIndex].weight = weight;
            } else {
                weightRecords.push({ date: date, weight: weight });
            }

            weightRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem('diet_app_weights', JSON.stringify(weightRecords));
            document.getElementById('weight-input').value = '';
            renderWeightList();
            alert("体重已记录！");
        }

        function renderWeightList() {
            const listDiv = document.getElementById('weight-list');
            if (weightRecords.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; color:#999; font-size:13px; padding:10px;">暂无体重数据</div>';
                return;
            }

            listDiv.innerHTML = '';
            const recentRecords = weightRecords.slice(0, 7);

            recentRecords.forEach((record, index) => {
                const prevRecord = recentRecords[index + 1];
                let trendHtml = '';

                if (prevRecord) {
                    const diff = parseFloat(record.weight) - parseFloat(prevRecord.weight);
                    if (diff > 0) trendHtml = `<span class="trend trend-up">↑${diff.toFixed(1)}kg</span>`;
                    else if (diff < 0) trendHtml = `<span class="trend trend-down">↓${Math.abs(diff).toFixed(1)}kg</span>`;
                    else trendHtml = `<span class="trend trend-same">-</span>`;
                }

                const div = document.createElement('div');
                div.className = 'weight-item';
                div.innerHTML = `
                    <span class="date">${record.date}</span>
                    <span><span class="value">${record.weight}</span> kg ${trendHtml}</span>
                `;
                listDiv.appendChild(div);
            });
        }

        function addBubble(role, text) {
            const chatPanel = document.getElementById('panel-chat');
            const bubble = document.createElement('div'); bubble.className = `chat-bubble chat-${role}`; bubble.innerText = text;
            chatPanel.appendChild(bubble); chatPanel.scrollTop = chatPanel.scrollHeight;
        }

        function saveChatHistory() { if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50); localStorage.setItem('diet_app_chat', JSON.stringify(chatHistory)); }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); element.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active')); document.getElementById('panel-' + tabName).classList.add('active');
            document.getElementById('inputArea').style.display = tabName === 'chat' ? 'flex' : 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput'); const text = input.value.trim(); if (!text) return;
            addBubble('user', text); chatHistory.push({ role: "user", content: text }); input.value = ''; saveChatHistory();
            const sendBtn = document.getElementById('sendBtn'); sendBtn.disabled = true; sendBtn.innerText = '...';

            try {
                let systemPrompt = "你是一个专业、热情的饮食记录营养师。如果用户描述了饮食，调用 record_diet 工具记录数据；如果用户提到了体重，调用 record_weight 工具记录；如果用户提问，请提供专业、易懂的营养学建议。并在记录完成后给出一句简短的健康点评。";
                if (userProfile.gender) { systemPrompt += `用户信息：性别${userProfile.gender}，年龄${userProfile.age}岁，身高${userProfile.height}cm，体重${userProfile.weight}kg，当前目标：${userProfile.goal}。`; }
                chatHistory[0] = { role: "system", content: systemPrompt };

                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: MODEL_NAME, messages: chatHistory, temperature: 0.7, tools: [recordDietTool, recordWeightTool], tool_choice: "auto" }) });
                const data = await response.json();

                if (data.error) {
                    addBubble('ai', `❌ 接口报错：${data.error.message || JSON.stringify(data.error)}`);
                    return;
                }
                const message = data.choices[0].message;
                let finalReplyText = "";

                if (message.tool_calls && message.tool_calls.length > 0) {
                    const toolCall = message.tool_calls[0];

                    if (toolCall.function.name === "record_diet") {
                        const parsedArgs = JSON.parse(toolCall.function.arguments);
                        parsedArgs.date = getLocalDateStr();
                        dietRecords.push(parsedArgs);
                        localStorage.setItem('diet_app_records', JSON.stringify(dietRecords));

                        document.getElementById('date-filter').value = parsedArgs.date;
                        renderTable();

                        chatHistory.push(message); chatHistory.push({ role: "tool", tool_call_id: toolCall.id, content: JSON.stringify({status: "记录成功"}) });
                    }
                    else if (toolCall.function.name === "record_weight") {
                        const parsedArgs = JSON.parse(toolCall.function.arguments);
                        const recordDate = parsedArgs.date || getLocalDateStr();

                        const existingIndex = weightRecords.findIndex(r => r.date === recordDate);
                        if (existingIndex > -1) { weightRecords[existingIndex].weight = parsedArgs.weight; }
                        else { weightRecords.push({ date: recordDate, weight: parsedArgs.weight }); }

                        weightRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
                        localStorage.setItem('diet_app_weights', JSON.stringify(weightRecords));
                        renderWeightList();

                        chatHistory.push(message); chatHistory.push({ role: "tool", tool_call_id: toolCall.id, content: JSON.stringify({status: "记录成功"}) });
                    }

                    const feedbackRes = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: MODEL_NAME, messages: chatHistory, temperature: 0.7 }) });
                    const feedbackData = await feedbackRes.json();
                    finalReplyText = feedbackData.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: finalReplyText });

                } else if (message.content) {
                    finalReplyText = message.content;
                    chatHistory.push({ role: "assistant", content: finalReplyText });
                }
                addBubble('ai', finalReplyText); saveChatHistory();
            } catch (error) {
                console.error("API请求失败:", error);
                addBubble('ai', "网络请求失败，请检查 API 余额或控制台报错。");
            } finally {
                sendBtn.disabled = false; sendBtn.innerText = '➤';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('diet-table-body');
            const selectedDate = document.getElementById('date-filter').value;
            tbody.innerHTML = '';
            let filteredRecords = dietRecords.filter(record => record.date === selectedDate);

            if (filteredRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">该日暂无记录</td></tr>`;
                return;
            }

            filteredRecords.forEach(record => {
                record.foods.forEach(food => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><span class="tag">${record.meal || '加餐'}</span></td><td>${food.name}</td><td>${food.quantity}</td><td style="color: #D97706; font-weight:800;">${food.calories || '-'}</td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        function downloadCSV() {
            if (dietRecords.length === 0) { alert("没有饮食数据可导出"); return; }
            let csvContent = "\uFEFF日期,餐次,食物,数量,估算热量\n";
            dietRecords.forEach(record => { record.foods.forEach(food => { csvContent += `${record.date || ''},${record.meal || '加餐'},${food.name},${food.quantity},${food.calories || ''}\n`; }); });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `饮食记录_${getLocalDateStr()}.csv`;
            link.click();
        }

        async function generateAnalysis() {
            const btn = document.querySelector('#panel-analysis .action-btn');
            const contentDiv = document.getElementById('analysis-content');
            if (chatHistory.length <= 1) { alert("还没有任何记录！"); return; }

            btn.innerText = "正在分析中..."; btn.disabled = true; contentDiv.style.display = 'none';

            try {
                let weightContext = "";
                if (weightRecords.length > 0) {
                    weightContext = "用户近期体重记录：" + weightRecords.slice(0, 10).map(r => `${r.date}: ${r.weight}kg`).join(", ") + "。";
                } else {
                    weightContext = "用户近期无体重记录。";
                }

                let analysisSystemPrompt = `你是一个专业的营养分析专家。请根据用户提供的历史饮食记录，生成一份详细的饮食优缺点分析。${weightContext} 请用简洁的 Markdown 格式输出，必须包含三级标题「### ✅ 饮食优点」「### ⚠️ 饮食不足」「### 💡 改进建议」，每个标题下用无序列表「- 」列出要点。不要调用任何工具，直接输出纯文本分析。`;

                if (userProfile.gender) {
                    analysisSystemPrompt += `用户信息：性别${userProfile.gender}，年龄${userProfile.age}岁，身高${userProfile.height}cm，体重${userProfile.weight}kg，当前目标：${userProfile.goal}。请结合这些信息进行分析。`;
                }

                const cleanHistory = chatHistory
                    .filter(msg => (msg.role === 'user' || msg.role === 'assistant') && typeof msg.content === 'string' && msg.content.trim().length > 0)
                    .slice(-20)
                    .map(msg => ({ role: msg.role, content: msg.content }));

                const analysisPrompt = [
                    { role: "system", content: analysisSystemPrompt },
                    ...cleanHistory,
                    { role: "user", content: "请根据以上历史记录，生成我的饮食优缺点分析。" }
                ];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: analysisPrompt,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ' ' + response.statusText);
                }

                const data = await response.json();

                if (data.error) {
                    contentDiv.innerHTML = "<p style='color:red;'>接口报错：" + (data.error.message || JSON.stringify(data.error)) + "</p>";
                    contentDiv.style.display = 'block';
                    return;
                }

                let rawContent = '';
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const msg = data.choices[0].message;
                    rawContent = msg.content || msg.reasoning_content || '';
                }

                rawContent = rawContent.replace(/```html/g, '').replace(/```/g, '').trim();

                if (!rawContent) {
                    contentDiv.innerHTML = "<p style='color:#999;'>AI 返回内容为空，请再点一次「重新生成分析」。</p>";
                    contentDiv.style.display = 'block';
                    return;
                }

                let htmlContent;
                if (rawContent.indexOf('<h4>') === -1 && rawContent.indexOf('<ul>') === -1) {
                    htmlContent = rawContent
                        .replace(/^###\s*(.+)$/gm, '<h4>$1</h4>')
                        .replace(/^##\s*(.+)$/gm, '<h4>$1</h4>')
                        .replace(/^#\s*(.+)$/gm, '<h4>$1</h4>')
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');

                    htmlContent = htmlContent.replace(/(<li>[\s\S]*?<\/li>)(?![\s\S]*?<li>)/g, function(match) {
                        return '<ul>' + match + '</ul>';
                    });
                    htmlContent = htmlContent.replace(/\n{2,}/g, '<br>').replace(/\n/g, '<br>');
                    htmlContent = htmlContent.replace(/<br><ul>/g, '<ul>').replace(/<\/ul><br>/g, '</ul>');
                } else {
                    htmlContent = rawContent;
                }

                contentDiv.innerHTML = htmlContent;
                contentDiv.style.display = 'block';
                btn.innerText = "🔄 重新生成分析";
            } catch (error) {
                console.error("分析失败:", error);
                contentDiv.innerHTML = "<p style='color:red;'>分析失败：" + (error.message || '未知错误') + "<br><span style='font-size:12px;color:#999;'>如果是 Failed to fetch，请检查网络或稍后重试</span></p>";
                contentDiv.style.display = 'block';
                btn.innerText = "✨ 生成饮食优缺点分析";
            } finally {
                btn.disabled = false;
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/diet-app/sw.js').catch(err => console.log('SW失败:', err));
        }
    </script>
</body>
